name: Buscar noticias sobre ELA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  buscar-noticias:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Buscar noticias
        run: |
          python scripts/buscar_noticias_ela.py
          cp candidate-news.json candidate-news.backup.json

      - name: Guardar noticias candidatas como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: noticias-candidatas-ela
          path: |
            candidate-news.json
            candidate-news.backup.json
          retention-days: 7
